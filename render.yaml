services:
  # Backend API Service
  - type: web
    name: carbondesk-api
    runtime: node
    plan: standard
    branch: main
    buildCommand: "cd server && npm run build"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        scope: project
        sync: false
      - key: DATABASE_URL
        scope: project
        sync: false
      - key: DB_HOST
        scope: project
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        scope: project
        sync: false
      - key: DB_USER
        scope: project
        sync: false
      - key: DB_PASSWORD
        scope: project
        sync: false
      - key: DB_SSL
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: ALLOWED_MIME_TYPES
        value: "application/pdf,image/jpeg,image/png,image/gif,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      - key: CORS_ORIGIN
        scope: project
        sync: false
      - key: AWS_ACCESS_KEY_ID
        scope: project
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        scope: project
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        scope: project
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

