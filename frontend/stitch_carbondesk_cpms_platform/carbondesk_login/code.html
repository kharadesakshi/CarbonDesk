<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle Background Pattern */
        .bg-pattern {
            background-color: #f9f9ff;
            background-image: radial-gradient(#d8e3fb 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Transition Classes */
        .hidden-state {
            display: none !important;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased p-lg">
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm relative overflow-hidden">
<!-- Top Green Accent Line -->
<div class="h-1 w-full bg-secondary"></div>
<div class="p-xl">
<!-- Header Section -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary-container text-on-primary mb-md">
<span class="material-symbols-outlined text-[28px] fill-icon">energy_savings_leaf</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">CarbonDesk</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Enterprise Carbon Management</p>
</div>
<!-- Login Form (Initial State) -->
<form class="space-y-lg" id="loginForm">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="block w-full pl-[36px] pr-sm py-sm border border-outline-variant rounded-DEFAULT text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-all bg-surface-container-lowest font-body-md text-body-md placeholder:text-outline-variant" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="block w-full pl-[36px] pr-sm py-sm border border-outline-variant rounded-DEFAULT text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-all bg-surface-container-lowest font-body-md text-body-md placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-secondary border-outline-variant rounded-sm cursor-pointer" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-md px-lg border border-transparent rounded-lg text-on-primary bg-primary-container hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary font-title-md text-title-md shadow-sm relative h-[48px] items-center" id="submitBtn" type="submit">
<span id="btnText">Login</span>
<div class="spinner hidden-state absolute" id="btnSpinner"></div>
</button>
</form>
<!-- Success State (Hidden Initially) -->
<div class="hidden-state text-center py-xl fade-in" id="successState">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-secondary-container text-on-secondary-container mb-md">
<span class="material-symbols-outlined text-[32px] fill-icon">check_circle</span>
</div>
<h2 class="font-title-lg text-title-lg text-primary mb-sm">Authentication Successful</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Redirecting to your dashboard...</p>
</div>
<!-- Footer Links -->
<div class="mt-xl text-center border-t border-surface-variant pt-lg" id="footerLinks">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    New organization? 
                    <a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors ml-xs" href="#">Request Access</a>
</p>
</div>
</div>
</main>
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const form = document.getElementById('loginForm');
            const successState = document.getElementById('successState');
            const footerLinks = document.getElementById('footerLinks');

            // 1. Loading State
            btn.disabled = true;
            btnText.classList.add('hidden-state');
            btnSpinner.classList.remove('hidden-state');
            btn.classList.add('opacity-90', 'cursor-not-allowed');

            // 2. Simulate Network Request
            setTimeout(() => {
                // Hide Form and Show Success
                form.classList.add('hidden-state');
                footerLinks.classList.add('hidden-state');
                successState.classList.remove('hidden-state');
            }, 1500);
        });
    </script>
</body></html>
